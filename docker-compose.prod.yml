version: '3.8'

services:
  web:
    build: .
    container_name: simba-web-prod
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=simba-refact.irit.fr
      - DATABASE_URL=db
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - simba-network
    expose:
      - "8000"

  db:
    image: postgres:15
    container_name: simba-db-prod
    environment:
      POSTGRES_DB: simba_db
      POSTGRES_USER: simba_user
      POSTGRES_PASSWORD: simba_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - simba-network

  nginx:
    image: nginx:alpine
    container_name: simba-nginx-prod
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/nginx.conf
      - static_volume:/app/static
      - media_volume:/app/media
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - simba-network

  chainlit:
    build:
      context: .
      dockerfile: Dockerfile.chainlit
    container_name: simba-chainlit-prod
    environment:
      - CHAINLIT_HOST=0.0.0.0
      - CHAINLIT_PORT=8500
      - DJANGO_HOST=web
      - DJANGO_PORT=8000
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - simba-network
    expose:
      - "8500"

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  simba-network:
    driver: bridge 