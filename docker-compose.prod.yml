version: '3.8'

services:
  web:
    build: .
    container_name: simba-web-prod
    env_file:
      - .env
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=simba-refact.irit.fr
      - DB_HOST=db
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - simba-network
    expose:
      - "8000"

  db:
    image: postgres:16
    container_name: simba-db-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - simba-network
    ports:
      - "5433:5433"
    command: ["postgres", "-c", "port=5433"]

  nginx:
    image: nginx:alpine
    container_name: simba-nginx-prod
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/nginx.conf
      - static_volume:/app/static
      - media_volume:/app/media
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - simba-network

  chainlit:
    build: .
    container_name: simba-chainlit-prod
    env_file:
      - .env
    environment:
      - CHAINLIT_HOST=0.0.0.0
      - CHAINLIT_PORT=8500
      - DJANGO_HOST=web
      - DJANGO_PORT=8000
      - DB_HOST=db
    command: ["chainlit", "run", "chainlit_app.py", "--host", "0.0.0.0", "--port", "8500"]
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - simba-network
    expose:
      - "8500"

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  simba-network:
    driver: bridge 