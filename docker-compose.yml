version: '3.8'

services:
  web:
    build: .
    env_file:
      - .env
    volumes:
      - web:/code
    entrypoint: ["sh", "/code/entrypoint.sh"]
    ports:
      - "8000:8000"
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  web:
  db:
