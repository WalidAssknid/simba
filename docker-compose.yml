version: '3.8'

services:
  web:
    build: .
    env_file:
      - .env
    environment:
      - DB_HOST=db
    volumes:
      - web:/code
    entrypoint: ["sh", "/code/entrypoint.sh"]
    ports:
      - "8000:8000"
    depends_on:
      - db
  
  chainlit:
    build: .
    env_file:
      - .env
    environment:
      - DB_HOST=db
    volumes:
      - web:/code
    command: ["chainlit", "run", "chainlit_app.py", "--host", "0.0.0.0", "--port", "8500"]
    ports:
      - "8500:8500"
    depends_on:
      - db
      - web
  
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - "5433:5433"

volumes:
  web:
  db:
