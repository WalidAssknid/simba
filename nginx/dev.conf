events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Development server block
    server {
        listen 80;
        server_name localhost;
        client_max_body_size 100M;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Chainlit root-level assets (JS files)
        location ~ ^/assets/.*\.(js|mjs)$ {
            proxy_pass http://chainlit:8500;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Content-Type "application/javascript" always;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # Chainlit root-level assets (CSS files)
        location ~ ^/assets/.*\.css$ {
            proxy_pass http://chainlit:8500;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Content-Type "text/css" always;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # Chainlit public directory CSS files
        location ~ ^/public/.*\.css$ {
            proxy_pass http://chainlit:8500;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Content-Type "text/css" always;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # Chainlit public directory JS files
        location ~ ^/public/.*\.(js|mjs)$ {
            proxy_pass http://chainlit:8500;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Content-Type "application/javascript" always;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # Chainlit WebSocket support  
        location /chainlit/ {
            proxy_pass http://chainlit:8500/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
            proxy_cache_bypass $http_upgrade;
        }

        # Default: proxy everything else to Chainlit
        location / {
            proxy_pass http://chainlit:8500;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
} 