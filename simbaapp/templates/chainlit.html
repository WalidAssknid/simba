{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SIMBA - Chat - {{ activity.title|default:"Activity" }}</title>
    <link rel="stylesheet" href="{% static 'css/simba.css' %}">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        .chat-frame-container {
            width: 100%;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>
    <!-- JavaScript to check and log iframe URL -->
    <script>
        console.log("Activity ID parameter:", "{{ activity_id }}");
        console.log("User ID parameter:", "{{ user_id }}");
        console.log("Username parameter:", "{{ username }}");
    </script>
    
    <div class="chat-frame-container">
        <iframe 
            id="chainlitFrame"
            src="http://localhost:8500/?activity_id={{ activity_id }}&user_id={{ user_id }}&username={{ username|urlencode }}&lang=en" 
            width="100%" 
            height="100%"
            frameborder="0"
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"
            allow="clipboard-read; clipboard-write"
            referrerpolicy="origin"
        ></iframe>
    </div>
    
    <!-- Additional script to verify the iframe URL is correct -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const iframe = document.getElementById('chainlitFrame');
            console.log("Iframe src:", iframe.src);
            
            if (!iframe.src.includes('activity_id={{ activity_id }}')) {
                console.error("Parameters missing from iframe URL!");
            }
        });
    </script>
</body>
</html>
