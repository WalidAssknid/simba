{% extends 'base.html' %}
{% load i18n %}
{% block title %}Create Course | SIMBA{% endblock %}
{% block content %}
<div class="form-container">
    <h2>{% trans 'Create New Course' %}</h2>
    <form method="post" action="{% url 'create_course' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="title">{% trans 'Title:' %}</label>
            <input type="text" name="title" id="title" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="description">{% trans 'Description:' %}</label>
            <textarea name="description" id="description" rows="5" class="form-control"></textarea>
        </div>
        
        <div class="form-actions">
            <a href="{% url 'courses' %}" class="btn btn-danger">{% trans 'Cancel' %}</a>
            <button type="submit" class="btn btn-success">{% trans 'Create Course' %}</button>
        </div>
    </form>
</div>
{% endblock %}
