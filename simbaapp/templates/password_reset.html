{% extends 'base.html' %}

{% block title %}Set New Password - Simba Platform{% endblock %}

{% block extra_css %}
<style>
/* Fix button hover issues */
.btn-success:hover {
    background-color: #ac3300 !important;
    border-color: #ac3300 !important;
    color: white !important;
}

.btn-outline-secondary:hover {
    background-color: #6c757d !important;
    border-color: #6c757d !important;
    color: white !important;
}

/* Center SIMBA title in header */
.header-brand {
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    width: 100% !important;
    font-size: 1.5rem !important;
    font-weight: bold !important;
    position: static !important;
    left: auto !important;
    transform: none !important;
}

/* Add more spacing before the button */
.btn-spacing {
    margin-top: 2rem !important;
}

/* Mobile responsiveness */
@media (max-width: 768px) {
    .container {
        padding: 0 15px;
    }
    
    .card {
        margin: 0 10px;
        border-radius: 10px;
    }
    
    .card-body {
        padding: 1.5rem !important;
    }
    
    .btn {
        padding: 12px 20px;
        font-size: 16px;
    }
    
    .form-control {
        padding: 12px 15px;
        font-size: 16px;
    }
    
    .mb-7 {
        margin-bottom: 2rem !important;
    }
    
    .btn-spacing {
        margin-top: 2rem !important;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="container mt-3">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <div class="text-center mb-7">
                <a href="{% url 'login' %}" class="text-dark text-decoration-none">
                    <i class="fas fa-arrow-left me-2"></i>
                    Back to Login
                </a>
            </div>
            
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white text-center">
                    <h4 class="mb-0">Set New Password</h4>
                </div>
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <p class="text-muted">
                            Please enter your new password below.
                        </p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="new_password" class="form-label">New Password</label>
                            <input type="password" class="form-control" id="new_password" name="new_password" required 
                                   minlength="8" placeholder="Enter your new password">
                            <div class="form-text">
                                Password must be at least 8 characters long.
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="new_password_confirm" class="form-label">Confirm New Password</label>
                            <input type="password" class="form-control" id="new_password_confirm" name="new_password_confirm" required 
                                   minlength="8" placeholder="Confirm your new password">
                        </div>
                        
                        <div class="d-grid btn-spacing">
                            <button type="submit" class="btn btn-success">
                                Update Password
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('new_password_confirm').addEventListener('input', function() {
    const password = document.getElementById('new_password').value;
    const confirmPassword = this.value;
    
    if (password !== confirmPassword) {
        this.setCustomValidity('Passwords do not match');
    } else {
        this.setCustomValidity('');
    }
});

document.getElementById('new_password').addEventListener('input', function() {
    const confirmPassword = document.getElementById('new_password_confirm');
    if (confirmPassword.value) {
        confirmPassword.dispatchEvent(new Event('input'));
    }
});
</script>
{% endblock %}
