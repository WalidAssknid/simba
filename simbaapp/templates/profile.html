{% extends 'base.html' %}
{% block title %}Manage Account | SIMBA{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Manage Your Account</h2>
    <form method="post" action="{% url 'profile' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" name="username" id="username" class="form-control" value="{{ user.username }}" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" class="form-control" value="{{ user.email }}" required>
        </div>
        
        <div class="form-group">
            <label for="current_password">Current Password:</label>
            <input type="password" name="current_password" id="current_password" class="form-control" required>
            <small class="form-text text-muted">Required to make any changes to your profile.</small>
        </div>
        
        <h3>Change Password (Optional)</h3>
        
        <div class="form-group">
            <label for="new_password">New Password:</label>
            <input type="password" name="new_password" id="new_password" class="form-control">
            <small class="form-text text-muted">Leave blank to keep your current password.</small>
        </div>
        
        <div class="form-group">
            <label for="new_password_confirm">Confirm New Password:</label>
            <input type="password" name="new_password_confirm" id="new_password_confirm" class="form-control">
        </div>
        
        <div class="form-actions">
            <a href="{% url 'courses' %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-success">Update Profile</button>
        </div>
    </form>
</div>
{% endblock %}
